[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockneuron"
version = "0.0.1"
description = "Falsifiable experiments one abstraction level above a point neuron"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
crossmodal = ["datasets>=2.18", "pillow>=10"]

[tool.setuptools]
packages = ["blockneuron"]

[tool.pytest.ini_options]
pythonpath = ["."]

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python experiments/gate0_same_mass_different_machine.py --steps 300
      - run: python experiments/gate0r_passing_modes.py --steps 300
      - run: python experiments/gate0h_hysteretic_matter.py --trials 200
